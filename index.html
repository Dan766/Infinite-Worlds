<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infinite World</title>
    <!-- Empty data URI: stops the browser requesting /favicon.ico, which would
         404 on a bare static host and pollute the screenshot harness's
         zero-failed-requests check. -->
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        margin: 0;
        padding: 8px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        color: #d8e4ea;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #hud[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <pre id="hud" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
